services:
  postgres:
    image: postgres:16-alpine
    container_name: meu-caixa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meu_caixa
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - meu-caixa-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meu_caixa"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  meu-caixa-postgres-data:
